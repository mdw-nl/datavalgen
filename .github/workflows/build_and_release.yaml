name: Build and publish image

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # GitHub actions doens't offer regexes fir on:push:tags above.. so
      # we just fail fast here I guess....
      - name: Validate release tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag '${GITHUB_REF_NAME}'."
            echo "Expected v<major>.<minor>.<patch> (for example: v0.2.0)."
            exit 1
          fi

      - name: Set up Python
        # https://github.com/actions/setup-python/releases/tag/v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Set up uv
        # https://github.com/astral-sh/setup-uv/releases/tag/v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.15"

      - name: Install package and test deps from lockfile
        run: uv sync --locked --extra test

      - name: Run tests
        run: uv run --locked pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write   # needed for GitHub Container Registry (GHCR)

    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Compute image metadata
        id: meta
        # bash shenanigans to lower-case, etc
        run: |
          # lower-case repo: owner/repo -> owner/repo
          REPO_LC="${GITHUB_REPOSITORY,,}"

          # tag name from release push (for example: v0.2.0)
          TAG_VERSION="${GITHUB_REF_NAME}"

          echo "image_name=$REPO_LC" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        # https://github.com/docker/login-action/releases/tag/v4.1.0
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        # https://github.com/docker/build-push-action/releases/tag/v7.1.0
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.image_name }}:latest
            ghcr.io/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag_version }}
